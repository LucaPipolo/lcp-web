# This Docker Compose file is made to have several git worktrees running at the
# same time. Especially useful when working with multiple AI agents on parallel
# tasks. Each one gets its own containers and its own HTTPS .test domain,
# served by a Caddy container they all share.
#
# See rift.yaml. Start it with `rift setup` (or `rift up` once set up); plain
# `docker compose up` works too, as described in CONTRIBUTING.md.

name: "${COMPOSE_PROJECT_NAME:?run rift setup first}"

services:
  app:
    build:
      context: .
      dockerfile: ./.docker/bun/Dockerfile
    working_dir: /app
    command: >-
      sh -c "bun install --frozen-lockfile &&
      bun run dev --host 0.0.0.0 --port ${CONTAINER_PORT:?run rift setup first}
      --allowed-hosts ${BASE_DOMAIN:?run rift setup first},.${BASE_DOMAIN}
      --ignore-lock"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - "${GIT_COMMON_DIR:?set GIT_COMMON_DIR in .env}:${GIT_COMMON_DIR}"
    environment:
      NODE_ENV: development
      ASTRO_DEV_HMR_CLIENT_PORT: "${ASTRO_DEV_HMR_CLIENT_PORT:-443}"
    ports:
      - "${APP_PORT:-4321}:${CONTAINER_PORT:?run rift setup first}"
    networks:
      - default
      - router

volumes:
  node_modules:

networks:
  default:
  router:
    external: true
    name: "${ROUTER_NAME:?run rift setup first}"
