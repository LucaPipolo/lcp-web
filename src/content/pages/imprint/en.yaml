  - heading: "Purpose of this website"
    body: >-
      <p>This website presents my professional background,
      the projects I've worked on and the skills I've
      developed over the years. I also publish articles
      and technical content related to my work and provide
      different ways to get in touch with me.</p>
      <p>The website doesn't sell products or services
      directly, process payments or require you to
      create an account to access its content.</p>

  - heading: "Intellectual property"
    body: >-
      <p>Unless otherwise stated, the original text,
      design and images published on this website
      belong to me and are protected by applicable
      intellectual property laws.</p>
      <p>You may quote short extracts from the content,
      within the limits permitted by law, provided
      you clearly credit the author and link to the
      original page. Reproducing content in full
      or using it for commercial purposes requires
      my written permission, except where such use
      is permitted by law.</p>
      <p>Any third-party trademarks, logos or other
      materials remain the property of their respective
      owners. They're used solely to identify companies,
      products, services or technologies mentioned
      on this website.</p>

  - heading: "Links to external websites"
    body: >-
      <p>Some pages contain links to external websites
      and services that I don't manage or control.
      I include them because they may provide useful
      information or further reading on the topics
      discussed. This doesn't necessarily mean
      I endorse their content, terms of use
      or personal data practices.</p>
      <p>When you follow one of these links, you're
      visiting an independent website governed by
      its own terms and policies. I can't guarantee
      that external content will remain available,
      accurate or up to date, and I'm not responsible
      for the activities of external website operators,
      except where required by law.</p>

  - heading: "Responsibility for content"
    body: >-
      <p>I take care to ensure the information I publish
      is accurate, but I can't guarantee that it's
      always complete, free from errors or up to date.
      In particular, technical articles reflect my
      knowledge and experience at the time of publication.
      The tools, technologies and procedures they
      describe may change over time.</p>
      <p>Articles and examples on this website are
      provided for general information and educational
      purposes. Before applying a technical solution
      to a project, you should assess whether it's
      suitable for your particular circumstances
      and requirements.</p>
      <p>I also do my best to keep the website accessible
      and working properly, but I can't guarantee
      uninterrupted availability. Temporary disruptions
      may occur due to maintenance, technical issues
      or problems with third-party services.</p>
      <p>Nothing in this notice excludes or limits
      any liability that cannot be excluded
      or limited under applicable law.</p>

  - heading: "Hosting"
    body: >-
      <p>This website is hosted by
      <a href="https://vercel.com/" target="_blank" rel="noopener noreferrer">Vercel Inc.</a>,
      a company based in the United States.
      For more information about how this provider
      processes data, see
      <a href="https://vercel.com/legal/privacy-policy" target="_blank" rel="noopener noreferrer">Vercel's privacy policy</a>.</p>

  - heading: "Governing law and jurisdiction"
    body: >-
      <p>This website and legal notice are governed
      by Spanish law, without prejudice to any
      mandatory legal provisions that may apply.</p>
      <p>For disputes relating to this website,
      where permitted by law and validly agreed
      between the parties, the courts of Barcelona,
      Spain, shall have jurisdiction. In all other
      cases, jurisdiction shall be determined
      under the applicable legal rules, including
      those protecting consumers.</p>
