  - heading: "What this site is for"
    body: >-
      <p>This site covers my professional background, the projects I've
      worked on and how to get in touch. It doesn't sell anything, doesn't
      process payments and doesn't require registration.</p>

  - heading: "Intellectual property"
    body: >-
      <p>The text, visual design and images are mine, unless stated
      otherwise. You may quote them if you credit the source and link to
      the original page. Reproducing them in full or using them
      commercially requires my written permission.</p>
      <p>Any third-party trademarks or logos shown belong to their
      respective owners and are used only to identify the technology or
      company being referred to.</p>

  - heading: "Links to other websites"
    body: >-
      <p>Some pages link to sites I don't run or control. They're there
      because the linked content is relevant, not because I endorse its
      content, terms of use or how it handles your data. Once you follow a
      link, you're on a site independent of this one, subject to that
      site's own rules, for which I take no responsibility.</p>

  - heading: "Liability"
    body: >-
      <p>I review content before publishing it, but I cannot guarantee it
      is free of errors or that it remains accurate over time. The
      technical information here reflects my own experience; it is not
      advice on your specific situation.</p>
      <p>Nor can I guarantee the site will always be available, since this
      depends on third-party services and your own connection.</p>

  - heading: "Hosting"
    body: >-
      <p>This site is hosted by
      <a href="https://vercel.com/" target="_blank" rel="noopener noreferrer">Vercel Inc.</a>,
      based in the United States. Its privacy policy is available at
      <a href="https://vercel.com/legal/privacy-policy" target="_blank" rel="noopener noreferrer">vercel.com/legal/privacy-policy</a>.</p>

  - heading: "Governing law"
    body: >-
      <p>This notice is governed by Spanish law. For any dispute relating
      to the site, save where the law requires a different forum (for
      example, where the other party is a consumer), the parties submit to
      the jurisdiction of the courts of the city of Barcelona, Spain.</p>
