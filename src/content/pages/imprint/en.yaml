intro: >-
  This page provides the legal information and identification details
  required under Article 10 of
  <a href="https://www.boe.es/buscar/doc.php?id=BOE-A-2002-13758" target="_blank" rel="noopener noreferrer">Spanish Law 34/2002 on Information Society Services and Electronic Commerce (LSSI-CE)</a>.
  It also explains the conditions relating to the use of
  content, external links and responsibility for the
  information published on this website.

