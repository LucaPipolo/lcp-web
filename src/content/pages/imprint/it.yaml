  - heading: "Finalità del sito"
    body: >-
      <p>Questo sito presenta il mio percorso professionale,
      i progetti a cui ho lavorato e le competenze che ho
      maturato nel tempo. Pubblico anche articoli e contenuti
      tecnici legati al mio lavoro e metto a disposizione
      diversi modi per contattarmi.</p>
      <p>Il sito non vende prodotti o servizi direttamente,
      non gestisce pagamenti e non richiede la creazione
      di un account per consultare i contenuti.</p>

  - heading: "Proprietà intellettuale"
    body: >-
      <p>Salvo dove diversamente indicato, i testi, il design
      e le immagini originali pubblicati su questo sito
      sono di mia proprietà e sono protetti dalla normativa
      applicabile in materia di proprietà intellettuale.</p>
      <p>Puoi citare brevi estratti dei contenuti, nel rispetto
      dei limiti previsti dalla legge, indicando chiaramente
      l'autore e inserendo un link alla pagina originale.
      Per riprodurre integralmente i contenuti o utilizzarli
      a fini commerciali è necessaria la mia autorizzazione
      scritta, salvo gli utilizzi consentiti dalla legge.</p>
      <p>Eventuali marchi, loghi e altri elementi appartenenti
      a terzi rimangono di proprietà dei rispettivi titolari.
      Sono utilizzati esclusivamente per identificare
      aziende, prodotti, servizi o tecnologie citati
      nei contenuti del sito.</p>

  - heading: "Collegamenti a siti esterni"
    body: >-
      <p>Alcune pagine contengono link a siti e servizi esterni
      che non gestisco e sui quali non ho alcun controllo.
      Li inserisco perché possono offrire informazioni utili
      o approfondimenti pertinenti agli argomenti trattati,
      senza che questo implichi necessariamente un'approvazione
      dei loro contenuti, delle condizioni d'uso o delle
      modalità di trattamento dei dati personali.</p>
      <p>Quando segui uno di questi collegamenti, accedi
      a un sito indipendente, soggetto alle condizioni
      e alle informative del rispettivo gestore.
      Non posso garantire che i contenuti esterni
      rimangano disponibili, corretti o aggiornati,
      né rispondo delle attività svolte dai relativi
      gestori, salvo nei casi previsti dalla legge.</p>

  - heading: "Responsabilità sui contenuti"
    body: >-
      <p>Presto attenzione all'accuratezza delle informazioni
      che pubblico, ma non posso garantire che siano sempre
      complete, prive di errori o aggiornate. In particolare,
      i contenuti tecnici riflettono le mie conoscenze
      ed esperienze al momento della pubblicazione:
      strumenti, tecnologie e procedure possono cambiare
      nel tempo.</p>
      <p>Gli articoli e gli esempi presenti sul sito
      hanno finalità informative e divulgative.
      Prima di applicare una soluzione tecnica
      a un progetto, è opportuno valutarne l'adeguatezza
      rispetto al proprio contesto e ai requisiti specifici.</p>
      <p>Mi impegno a mantenere il sito accessibile e
      funzionante, ma non posso garantirne la disponibilità
      continua. Possono verificarsi interruzioni temporanee
      dovute a manutenzione, problemi tecnici o disservizi
      dei fornitori esterni.</p>
      <p>Queste precisazioni non escludono né limitano
      le responsabilità previste dalla normativa applicabile.</p>

  - heading: "Hosting"
    body: >-
      <p>Il sito è ospitato da
      <a href="https://vercel.com/" target="_blank" rel="noopener noreferrer">Vercel Inc.</a>,
      società con sede negli Stati Uniti.
      Per maggiori informazioni sul trattamento dei dati
      da parte del fornitore, puoi consultare la
      <a href="https://vercel.com/legal/privacy-policy" target="_blank" rel="noopener noreferrer">politica sulla privacy di Vercel</a>.</p>

  - heading: "Legge applicabile e foro competente"
    body: >-
      <p>Il presente sito e queste note legali sono soggetti
      alla normativa spagnola, fatte salve le disposizioni
      inderogabili eventualmente applicabili.</p>
      <p>Per le controversie relative al sito, quando
      consentito dalla legge e validamente concordato
      tra le parti, il foro competente è quello
      di Barcellona, Spagna. Negli altri casi,
      la competenza è determinata dalle disposizioni
      di legge applicabili, comprese quelle a tutela
      dei consumatori.</p>
