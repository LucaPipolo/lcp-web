title: "Note legali"
updated: 2026-11-09
updatedLabel: "Ultimo aggiornamento:"

intro: >-
  Questa pagina contiene le informazioni legali e i dati
  identificativi del titolare del sito, come previsto
  dall'articolo 10 della
  <a href="https://www.boe.es/buscar/doc.php?id=BOE-A-2002-13758" target="_blank" rel="noopener noreferrer">legge spagnola 34/2002 sui servizi della società dell'informazione e del commercio elettronico (LSSI-CE)</a>.
  Trovi inoltre le condizioni relative all'utilizzo dei
  contenuti, ai collegamenti esterni e alla responsabilità
  per le informazioni pubblicate.

sections:
