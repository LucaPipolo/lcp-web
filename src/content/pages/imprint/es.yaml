metadata:
  title: "Aviso legal | Luca Pipolo"
  description: >-
    Quién está legalmente detrás de este sitio: nombre, contacto y datos
    fiscales, tal y como exige la LSSI-CE. No es una lectura apasionante,
    pero sí honesta.

title: "Aviso legal"
updated: 2026-11-09
updatedLabel: "Última actualización:"

intro: >-
  Esta página recoge la información legal y los datos identificativos
  del titular de la web, de acuerdo con lo establecido en el artículo 10
  de la
  <a href="https://www.boe.es/buscar/doc.php?id=BOE-A-2002-13758" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Ley 34/2002, de servicios de la sociedad de la información y de comercio electrónico (LSSI-CE)</a>.
  También encontrarás las condiciones relativas al uso de los contenidos,
  los enlaces externos y la responsabilidad sobre la información publicada.

sections:
