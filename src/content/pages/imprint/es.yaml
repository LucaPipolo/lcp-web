  - heading: "Finalidad de la web"
    body: >-
      <p>Esta web presenta mi trayectoria profesional,
      los proyectos en los que he trabajado y las competencias
      que he adquirido a lo largo de los años. También publico
      artículos y contenidos técnicos relacionados con mi trabajo
      y ofrezco distintas formas de contactar conmigo.</p>
      <p>La web no vende productos ni servicios directamente,
      no gestiona pagos y no requiere crear una cuenta
      para consultar sus contenidos.</p>

  - heading: "Propiedad intelectual"
    body: >-
      <p>Salvo que se indique lo contrario, los textos,
      el diseño y las imágenes originales publicados
      en esta web son de mi propiedad y están protegidos
      por la normativa aplicable en materia de propiedad
      intelectual.</p>
      <p>Puedes citar fragmentos breves de los contenidos,
      dentro de los límites establecidos por la ley,
      indicando claramente el autor e incluyendo
      un enlace a la página original. Para reproducir
      los contenidos íntegramente o utilizarlos
      con fines comerciales, necesitas mi autorización
      por escrito, salvo en los casos permitidos
      por la legislación aplicable.</p>
      <p>Las marcas, logotipos y demás elementos
      pertenecientes a terceros siguen siendo propiedad
      de sus respectivos titulares. Su presencia en esta
      web tiene únicamente la finalidad de identificar
      las empresas, productos, servicios o tecnologías
      mencionados en los contenidos.</p>

  - heading: "Enlaces a sitios externos"
    body: >-
      <p>Algunas páginas incluyen enlaces a webs y servicios
      externos que no gestiono y sobre los que no tengo
      ningún control. Los comparto porque pueden aportar
      información útil o ampliar los temas tratados,
      sin que esto implique necesariamente que respalde
      sus contenidos, condiciones de uso o prácticas
      de tratamiento de datos personales.</p>
      <p>Cuando sigues uno de estos enlaces, accedes
      a una web independiente, sujeta a las condiciones
      y políticas de su propio responsable. No puedo
      garantizar que sus contenidos sigan disponibles,
      sean correctos o estén actualizados, ni respondo
      de las actividades de sus responsables, salvo
      en los casos previstos por la ley.</p>

  - heading: "Responsabilidad sobre los contenidos"
    body: >-
      <p>Procuro que la información que publico sea
      correcta y esté actualizada, pero no puedo
      garantizar que los contenidos sean siempre
      completos, estén libres de errores o mantengan
      su vigencia con el paso del tiempo. En particular,
      los artículos técnicos reflejan mis conocimientos
      y experiencia en el momento de su publicación,
      y las herramientas, tecnologías y procedimientos
      que describo pueden cambiar.</p>
      <p>Los artículos y ejemplos de esta web tienen
      una finalidad informativa y divulgativa.
      Antes de aplicar una solución técnica a un proyecto,
      conviene comprobar que se adapta a su contexto
      y a sus requisitos específicos.</p>
      <p>También procuro mantener la web accesible
      y funcionando correctamente, aunque no puedo
      garantizar su disponibilidad ininterrumpida.
      Pueden producirse interrupciones temporales
      por tareas de mantenimiento, problemas técnicos
      o incidencias en los servicios de terceros.</p>
      <p>Estas aclaraciones no excluyen ni limitan
      las responsabilidades establecidas
      por la legislación aplicable.</p>

  - heading: "Alojamiento web"
    body: >-
      <p>Esta web está alojada en
      <a href="https://vercel.com/" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Vercel Inc.</a>,
      una empresa con sede en Estados Unidos.
      Puedes consultar más información sobre
      cómo trata los datos este proveedor en su
      <a href="https://vercel.com/legal/privacy-policy" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">política de privacidad</a>.</p>

  - heading: "Legislación aplicable y jurisdicción"
    body: >-
      <p>Esta web y el presente aviso legal se rigen
      por la legislación española, sin perjuicio
      de las disposiciones imperativas que
      puedan resultar aplicables.</p>
      <p>Para las controversias relacionadas con
      la web, cuando la ley lo permita y exista
      un acuerdo válido entre las partes,
      serán competentes los juzgados y tribunales
      de Barcelona, España. En los demás casos,
      la competencia se determinará conforme
      a la normativa aplicable, incluidas
      las disposiciones de protección
      de los consumidores.</p>
