intro: >-
  De acuerdo con lo establecido en la
  <a href="https://www.boe.es/buscar/doc.php?id=BOE-A-2002-13758" target="_blank" rel="noopener noreferrer">Ley 34/2002, de 11 de julio, de servicios de la sociedad de la información y de comercio electrónico (LSSI-CE)</a>,
  se informa a los usuarios de los siguientes datos identificativos del
  titular de este sitio web.

