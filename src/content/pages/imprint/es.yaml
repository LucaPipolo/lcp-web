  - heading: "Para qué sirve este sitio"
    body: >-
      <p>El sitio cuenta mi trayectoria profesional, los proyectos en los
      que he trabajado y cómo contactarme. No vende nada, no gestiona pagos
      y no requiere registro.</p>

  - heading: "Propiedad intelectual"
    body: >-
      <p>Los textos, el diseño gráfico y las imágenes son míos, salvo donde
      se indique lo contrario. Puedes citarlos indicando la fuente y
      enlazando la página original. Reproducirlos íntegramente o usarlos con
      fines comerciales requiere mi autorización por escrito.</p>
      <p>Las marcas y logotipos de terceros que puedan aparecer pertenecen a
      sus respectivos titulares y se utilizan solo para identificar la
      tecnología o la empresa de la que se está hablando.</p>

  - heading: "Enlaces a otros sitios"
    body: >-
      <p>Algunas páginas contienen enlaces a sitios que no gestiono ni
      controlo. Están presentes porque el contenido enlazado es pertinente,
      no porque apruebe su contenido, sus condiciones de uso o el
      tratamiento que hacen de tus datos. Al seguir un enlace, accedes a un
      sitio independiente de este, sujeto a las reglas de quien lo gestiona,
      del que no me hago responsable.</p>

  - heading: "Responsabilidad"
    body: >-
      <p>Reviso los contenidos antes de publicarlos, pero no garantizo que
      estén libres de errores ni que permanezcan exactos con el paso del
      tiempo. La información técnica que aparece aquí refleja mi
      experiencia, no constituye asesoramiento sobre tu caso concreto.</p>
      <p>Tampoco puedo garantizar que el sitio esté siempre disponible, ya
      que depende de servicios de terceros y de tu conexión.</p>

  - heading: "Alojamiento"
    body: >-
      <p>El sitio está alojado por
      <a href="https://vercel.com/" target="_blank" rel="noopener noreferrer">Vercel Inc.</a>,
      con sede en Estados Unidos. Su política de privacidad puede
      consultarse en
      <a href="https://vercel.com/legal/privacy-policy" target="_blank" rel="noopener noreferrer">vercel.com/legal/privacy-policy</a>.</p>

  - heading: "Ley aplicable"
    body: >-
      <p>Este aviso se rige por la legislación española. Para cualquier
      controversia relacionada con el sitio, salvo que la ley imponga un
      fuero distinto (por ejemplo, cuando la otra parte sea un consumidor),
      las partes se someten a la competencia de los juzgados y tribunales de
      la ciudad de Barcelona, España.</p>
