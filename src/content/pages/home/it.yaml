metadata:
  title: "Luca Pipolo | Full-Stack Web Developer & Technical Director"

sections:
  hero:
    badge:
      stem: "Disponibile per"
      tails:
        - "nuove opportunità"
        - "una pizza con melanzane"
        - "un progetto Laravel"
        - "sistemare il tuo javascript"
        - "un caffè a Barcellona"
        - "discutere di tab o spazi"
        - "una code review onesta"
    heading: 'Ciao, sono <span class="text-primary">Luca</span>'
    subheading: "Full-Stack Web Developer & Technical Director"
    body: >-
      Da <span class="text-primary">oltre 13 anni</span> costruisco applicazioni
      web, prodotti SaaS ed ecommerce, per startup, agenzie e aziende
      enterprise. Programmo, disegno interfacce e gestisco team
      multidisciplinari. Oggi dirigo la parte tecnica di <span
      class="text-primary">somoscuatro</span>, una società di consulenza
      digitale a Barcellona.
    actions:
      - label: "Contattami"
        href: "mailto:ciao@lucapipolo.com"
        variant: "inverted"
      - label: "Scarica il CV"
        href: "/resumes/luca-pipolo-full-stack-developer-resume-it.pdf"
        variant: "outline"
        download: true

  recommendations:
    heading: "raccomandazioni (10)"
    action:
      label: "Vedi tutte"
      href: "https://www.linkedin.com/in/lucapipolo/details/recommendations"
    quotes:
      - initials: "SM"
        avatar: "/recommendations/shadi-manna.jpeg"
        href: "https://www.linkedin.com/in/shadimanna-woocommerce-agency/"
        name: "Shadi Manna"
        role: "Founder & WooExpert, Progressus.io"
        text: >-
          Luca è uno sviluppatore full-stack molto capace. Ha aiutato la nostra
          agenzia su diversi progetti, sia lato frontend che backend. Comunica
          benissimo e si prende sul serio le proprie responsabilità.
      - initials: "TM"
        avatar: "/recommendations/tom-mursell.jpeg"
        href: "https://www.linkedin.com/in/mursell/"
        name: "Tom Mursell"
        role: "CMO & Head of Product Growth, Early"
        text: >-
          È stato un piacere lavorare con Luca. Insieme abbiamo affrontato
          numerosi problemi complessi: è ottimista di natura, porta energia
          e va veloce quando c'è da portare a casa il risultato.
          Uno che vorresti sicuramente dalla tua.
      - initials: "MB"
        avatar: "/recommendations/manuel-bruschi.jpeg"
        href: "https://www.linkedin.com/in/manuel-bruschi/"
        name: "Manuel Bruschi"
        role: "Co-Founder & CEO, Early"
        text: >-
          Dai a Luca un problema di frontend o backend nel mondo web e puoi
          stare tranquillo: capirà come risolverlo, coinvolgerà e gestirà gli
          stakeholder giusti e terrà tutti aggiornati senza bisogno di
          chiederglielo.
