metadata:
  title: "Privacy Policy | Luca Pipolo"
  description: >-
    What data this site collects and on what legal basis. Only the
    language and theme you choose are stored; no profiling, no data sold
    to third parties.

title: "Privacy Policy"
updated: 2026-11-09
updatedLabel: "Last updated:"

intro: >-
  This website only collects the data it needs to work, count visits,
  respond to messages and identify technical problems. It doesn't use profiling
  tools or sell your personal data. Here you'll find out what
  information is processed, why it's needed, who has access to it,
  how long it's kept and how you can exercise your rights.

sections:
  - heading: "Who is responsible for your data"
    items:
      - term: "Data controller"
        description: "Luca Pipolo"
      - term: "Contact"
        description: >-
          <a href="mailto:privacy@lucapipolo.com">privacy@lucapipolo.com</a>
      - term: "Identification details"
        description: >-
          You can find my full details in the
          <a href="/en/imprint/">legal notice</a>.
      - term: "Data Protection Officer"
        description: >-
          No Data Protection Officer (DPO) has been appointed.
          Based on the nature and characteristics of the
          processing described in this policy, the conditions
          requiring a DPO under Article 37 of
          <a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Regulation (EU) 2016/679 (GDPR)</a>
          do not apply.

  - heading: "What data is processed"
    items:
      - term: "Contact form"
        description: >-
          If you use the contact form, I collect the reason for
          your enquiry, your name, email address and message.
          I also record the page and language you submitted it
          from, along with the date and time. I use this information
          to handle your enquiry and reply to you. The form is
          optional: you can also email me directly or book a call,
          without affecting how the rest of the website works.
      - term: "Record of privacy information provided"
        description: >-
          When you submit the form, I also keep a record of the
          privacy information shown to you. This includes the
          exact wording, the version of this policy it refers to,
          the date and time of submission, the page you came from,
          your browser's user agent and a keyed hash derived from
          your IP address, explained further below. This record
          allows me to demonstrate what information you were
          given and when, should I ever need to.
      - term: "Spam protection"
        description: >-
          The contact form uses Cloudflare Turnstile to distinguish
          legitimate submissions from automated requests. During
          this check, Cloudflare processes your IP address and
          certain technical information about your browser and
          device. Turnstile is only used on the contact page.
      - term: "Email messages"
        description: >-
          If you contact me directly by email, I process your
          email address, any name you provide and the contents
          of your message to read, handle and respond to
          your enquiry.
      - term: "Booking a call"
        description: >-
          Call bookings are handled through Notion Calendar
          on a page outside this website. You'll be asked
          for your name and email address, and the booking
          will be added to my calendar along with any
          additional information you choose to provide.
      - term: "Language and theme preferences"
        description: >-
          When you change the language, your choice is saved
          in a cookie. If you change the website's theme,
          that preference is saved in your browser's local
          storage. Both remain on your device and are only
          stored when you use the relevant controls. They're
          not used to identify you, build a profile or link
          your visits together. For more information, see
          the <a href="/en/cookies/">cookie policy</a>.
      - term: "Visit statistics"
        description: >-
          To understand which pages are read and how visitors
          find the website, each page view records the date
          and time, the page address, the referring website,
          campaign parameters in the address such as
          <code>utm_source</code>, the approximate location
          (country, region and city), the operating system,
          the browser and their versions, and the device type.
          Page views from the same visitor are grouped for
          a single day only, as explained below.
      - term: "Performance metrics"
        description: >-
          To monitor website performance, information such
          as the page path and URL, device type, operating
          system, browser, connection speed, country of
          origin and page loading times is collected.
      - term: "Error reports"
        description: >-
          When a technical error occurs, information that
          helps identify its cause is collected, such as
          the error message, the location in the code where
          it occurred and the affected page. The system is
          configured to exclude IP addresses, form contents,
          cookies and recordings of your browsing activity
          from this collection.

  - heading: "Automated decision-making"
    body: >-
      <p>This website doesn't use automated decision-making
      that produces legal or similarly significant effects
      on users, and it doesn't carry out profiling.</p>
      <p>The contact form's spam protection is automated
      and may block a message it considers suspicious.
      If this happens, you can still contact me by email
      or book a call.</p>

  - heading: "How IP addresses are handled"
    body: >-
      <p>When you visit a website, the servers your browser
      communicates with necessarily receive your IP address
      so they can respond to requests. This website's
      technical service providers may also process it
      as part of their services.</p>
      <p>To count visits without cookies, Vercel Web Analytics
      groups the page views of the same visitor using a hash
      calculated from the request, which resets every
      24 hours. As a result, visits can't be linked across
      different days or different websites, and the data
      it stores doesn't include your IP address.</p>
      <p>According to Vercel's documentation, its performance
      metrics cannot be linked to a specific visit or IP
      address. The error reporting system is configured
      to exclude IP addresses from the data it collects.</p>
      <p>For the contact form, your IP address is also used
      to limit repeated submissions within a short period
      and to carry out Cloudflare Turnstile's spam check.</p>
      <p>In the record of privacy information provided,
      I don't store your original IP address. Instead,
      I store a hash calculated using a secret key kept
      separately. This makes it possible to compare records
      associated with the same address without storing
      the IP address in plain text. The hash is still
      considered pseudonymised personal data and is
      retained and deleted along with the record
      it belongs to.</p>

  - heading: "Legal bases for processing"
    body: >-
      <p>The GDPR requires all processing of personal data
      to have a legal basis. The basis that applies on this
      website depends on why the information is collected
      and used.</p>
      <p><strong>Messages and calls.</strong> When you contact
      me through the form, by email or by booking a call,
      I use the information needed to handle your enquiry
      and respond. This processing is based on legitimate
      interests under Article 6(1)(f) of the
      <a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">GDPR</a>.
      If your enquiry concerns a potential professional
      engagement or contractual relationship, Article 6(1)(b)
      may also apply, covering steps taken at your request
      before entering into a contract.</p>
      <p><strong>Record of privacy information provided.</strong>
      Keeping a record of the privacy information shown
      when you submit the form is based on the legitimate
      interest in demonstrating compliance with transparency
      obligations, in line with the accountability principle
      under Article 5(2) of the GDPR.</p>
      <p><strong>Security and spam protection.</strong>
      Cloudflare Turnstile checks and limits on repeated
      submissions are based on the legitimate interest
      in protecting the website against abuse and automated
      requests, under Article 6(1)(f) of the GDPR.
      This also takes account of Recital 49, which addresses
      network and information security.</p>
      <p><strong>Visit statistics, performance and error
      reporting.</strong> Any processing of personal data
      necessary to count visits, monitor performance and
      identify technical problems is based on the legitimate
      interest in understanding how the website is used
      and keeping it working, secure and reliable. Data collection is
      limited to what is necessary for these purposes,
      with settings designed to minimise the personal
      data processed.</p>
      <p><strong>Language and theme preferences.</strong>
      These settings are only stored when you choose
      to change them, and they're used solely to remember
      your preferences. Under these conditions, storing
      them is exempt from consent under Article 22.2 of
      <a href="https://www.boe.es/buscar/doc.php?id=BOE-A-2002-13758" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Spanish Law 34/2002 on Information Society Services and Electronic Commerce (LSSI-CE)</a>,
      as they form part of a service explicitly requested
      by the user.</p>
      <p>None of the processing described in this policy
      relies on consent as its legal basis. The checkbox
      on the contact form simply confirms that you've
      received the privacy information. If any future
      processing requires consent, I'll ask for it
      beforehand, and you'll be able to withdraw it
      at any time.</p>

  - heading: "External providers and services"
    body: >-
      <p>I use several external services to run this website.
      These providers process the information needed to
      perform their respective functions. The purposes
      and conditions of processing depend on each service
      and the provider's role.</p>
      <p>In particular, Cloudflare processes data collected
      through Turnstile both to protect the contact form
      on my behalf and, as an independent data controller,
      to improve its own bot detection systems.
      These activities are explained in the
      <a href="https://www.cloudflare.com/turnstile-privacy-policy/" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Turnstile Privacy Addendum</a>.</p>
    items:
      - term: "Vercel Inc."
        description: >-
          Hosts the website, runs the server-side code
          for the contact form, provides perimeter security,
          collects visit statistics through
          <a href="https://vercel.com/docs/analytics" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Vercel Web Analytics</a>
          and performance metrics through
          <a href="https://vercel.com/docs/speed-insights" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Vercel Speed Insights</a>.
          See <a href="https://vercel.com/legal/privacy-policy" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Vercel's privacy policy</a>
          and <a href="https://vercel.com/docs/analytics/privacy-policy" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">how Web Analytics handles data</a>.
      - term: "Functional Software, Inc."
        description: >-
          Provides
          <a href="https://sentry.io/" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Sentry</a>,
          which is used to collect and analyse error reports.
          See <a href="https://sentry.io/privacy/" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Sentry's privacy policy</a>.
      - term: "Cloudflare, Inc."
        description: >-
          Provides
          <a href="https://www.cloudflare.com/products/turnstile/" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Turnstile</a>,
          which protects the contact form against spam
          and automated requests.
          See <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Cloudflare's privacy policy</a>.
      - term: "Sendinblue SAS (Brevo)"
        description: >-
          Delivers messages submitted through the contact
          form to my email inbox using
          <a href="https://www.brevo.com/" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Brevo</a>.
          See <a href="https://www.brevo.com/legal/privacypolicy/" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Brevo's privacy policy</a>.
      - term: "Neon, a Databricks company"
        description: >-
          Through <a href="https://neon.com/" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Neon</a>,
          hosts two separate databases in Frankfurt, Germany:
          one for messages received through the contact form
          and another for records of the privacy information
          provided to users.
          See <a href="https://www.databricks.com/legal/privacynotice" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Databricks' privacy notice</a>.
      - term: "Notion Labs, Inc."
        description: >-
          Provides
          <a href="https://www.notion.com/product/calendar" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Notion Calendar</a>,
          which is used to manage call bookings.
          See <a href="https://www.notion.so/notion/Privacy-Policy-3468d120cf614d4c9014c09f6adc9091" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Notion's privacy policy</a>.

  - heading: "Data transfers outside the European Economic Area"
    body: >-
      <p>Brevo is a French company, while the contact form
      databases hosted by Neon are located in Frankfurt,
      Germany. Other providers, including Vercel, Sentry,
      Cloudflare and Notion, are US companies or belong
      to groups based in the United States. Neon is also
      part of a US-based group.</p>
      <p>As a result, some personal data may be transferred
      or made accessible outside the European Economic
      Area (EEA). Where applicable, these transfers
      are covered by the
      <a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32021D0914" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">standard contractual clauses approved by the European Commission under Implementing Decision (EU) 2021/914</a>
      or by the
      <a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32023D1795" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">adequacy decision (EU) 2023/1795 concerning the EU-US Data Privacy Framework</a>,
      provided the recipient meets the relevant
      requirements.</p>
      <p>You can find information about the safeguards
      used by each provider in their respective privacy
      policies, linked in the previous section.</p>

  - heading: "How long data is kept"
    body: >-
      <p>Messages submitted through the contact form are
      stored in the database for 12 months after receipt,
      then deleted. Records of the privacy information
      provided when the form was submitted are kept
      for 3 years to demonstrate compliance with
      transparency obligations, after which they're
      also deleted.</p>
      <p>Emails, including copies of contact form messages
      delivered to my inbox, are kept for as long as
      necessary to manage the conversation and any
      related activities. Once they're no longer needed,
      they're deleted, unless an applicable legal
      obligation requires them to be retained.</p>
      <p>Visit statistics, performance metrics and error reports are kept
      for the periods set by their respective providers
      and the configurations in use. Language and theme
      preferences remain on your device until you clear
      this website's data from your browser.</p>

  - heading: "Your rights"
    body: >-
      <p>The GDPR gives you several rights concerning
      your personal data. You can ask what information
      is being processed and request a copy, ask for
      it to be corrected or deleted, and, where the
      law provides, object to processing or request
      that it be restricted. You may also exercise
      your right to data portability when the
      conditions set out in Article 20 of the GDPR
      are met.</p>
      <p>To exercise these rights, you can email me at
      <a href="mailto:privacy@lucapipolo.com">privacy@lucapipolo.com</a>.
      You'll receive a response within one month of
      your request, subject to any extensions permitted
      under Article 12 of the
      <a href="https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">GDPR</a>.
      If an extension is needed, you'll be informed
      within the required timeframe.</p>
      <p>These rights may apply, in particular, to
      messages you've sent through the contact form
      or by email, and their associated records.
      Where information is genuinely anonymous
      and cannot identify an individual, it's
      not possible to locate or retrieve data
      relating to a particular user.</p>
      <p>If you believe your personal data hasn't
      been handled in accordance with the law,
      you can lodge a complaint with Spain's
      data protection authority, the
      <a href="https://www.aepd.es" target="_blank" rel="noopener noreferrer" aria-describedby="new-tab">Agencia Española de Protección de Datos (AEPD)</a>,
      or with the relevant supervisory authority
      in the country where you live, work or
      where the alleged infringement took place.</p>

  - heading: "Changes to this policy"
    body: >-
      <p>If the services used, the categories of data
      collected or the purposes of processing change,
      I'll update this policy before introducing
      those changes where necessary, and show
      the new last updated date at the top
      of the page.</p>
