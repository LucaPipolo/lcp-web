  title: "Informativa sui cookie | Luca Pipolo"

title: "Informativa sui cookie"
updated: 2026-11-09
updatedLabel: "Ultimo aggiornamento:"

intro: >-
  Questo sito utilizza un cookie per ricordare la lingua che scegli e
  il local storage del browser per salvare la preferenza tra tema chiaro
  e scuro. Entrambi vengono utilizzati soltanto quando modifichi
  queste impostazioni. Non ci sono cookie pubblicitari, strumenti di
  profilazione o sistemi che tracciano la tua navigazione tra più
  visite. Per questo motivo non compare alcun cookie banner.
  Il sito utilizza inoltre alcuni strumenti per monitorare le
  prestazioni, rilevare gli errori e proteggere il modulo di contatto
  dallo spam. Qui trovi come funzionano, quali informazioni trattano
  e perché non è necessario richiedere il tuo consenso.

sections:
  - heading: "Titolare del trattamento"
    body: >-
      <p>Il titolare del trattamento è Luca Pipolo,
      contattabile all'indirizzo
      <a href="mailto:privacy@lucapipolo.com">privacy@lucapipolo.com</a>.
      Puoi trovare i miei dati identificativi completi
      nelle <a href="/it/imprint/">note legali</a>.</p>

  - heading: "Quali informazioni vengono salvate nel browser"
    body: >-
      <p>Il sito non salva cookie o preferenze nel local storage
      quando apri una pagina. Le uniche informazioni memorizzate
      direttamente dal sito sono la lingua e il tema che scegli,
      e vengono salvate soltanto quando utilizzi i rispettivi
      controlli.</p>
    items:
      - term: "locale (cookie)"
        description: >-
          Memorizza la lingua selezionata quando utilizzi il
          selettore presente sul sito. Serve a mostrarti il sito
          nella lingua che preferisci quando torni all'indirizzo
          principale, senza doverla scegliere di nuovo.
          Il cookie dura un anno, non contiene identificatori
          personali e viene inviato esclusivamente a questo sito.
          Non viene creato durante il semplice caricamento
          di una pagina.
      - term: "lcp-theme (local storage)"
        description: >-
          Memorizza la tua scelta tra tema chiaro e scuro.
          Viene salvata nel local storage del browser, quindi
          non si tratta di un cookie, e viene scritta soltanto
          quando utilizzi l'interruttore del tema. Se non hai
          espresso alcuna preferenza, il sito segue
          automaticamente quella del sistema operativo,
          adattandosi anche ai suoi eventuali cambiamenti.
          Questa impostazione non ha una scadenza prestabilita
          e rimane salvata finché non cancelli i dati del sito
          dal browser.

  - heading: "Perché non c'è un cookie banner"
    body: >-
      <p>L'articolo 22.2 della
      <a href="https://www.boe.es/buscar/doc.php?id=BOE-A-2002-13758" target="_blank" rel="noopener noreferrer">legge spagnola 34/2002 (LSSI-CE)</a>,
      modificato dal
      <a href="https://www.boe.es/buscar/act.php?id=BOE-A-2012-4442" target="_blank" rel="noopener noreferrer">Real Decreto-ley 13/2012</a>
      in recepimento della normativa europea sui cookie,
      prevede che l'utente debba esprimere il proprio consenso
      prima che vengano archiviate o lette informazioni
      sul suo dispositivo. La regola deriva dalla
      <a href="https://eur-lex.europa.eu/legal-content/IT/TXT/HTML/?uri=CELEX:32002L0058" target="_blank" rel="noopener noreferrer">direttiva 2002/58/CE</a>,
      successivamente modificata dalla
      <a href="https://eur-lex.europa.eu/legal-content/IT/TXT/HTML/?uri=CELEX:32009L0136" target="_blank" rel="noopener noreferrer">direttiva 2009/136/CE</a>.</p>
      <p>La normativa prevede però alcune eccezioni. In
      particolare, il consenso non è necessario quando
      la memorizzazione o l'accesso alle informazioni
      è strettamente necessario per fornire un servizio
      richiesto espressamente dall'utente.</p>
      <p>È il caso delle preferenze di lingua e tema utilizzate
      da questo sito. Quando scegli una lingua o cambi il tema,
      il browser memorizza l'impostazione soltanto per ricordare
      la tua scelta nelle visite successive. Queste informazioni
      non vengono utilizzate per altre finalità, né per
      identificarti o analizzare il tuo comportamento.</p>
      <p>Anche le
      <a href="https://www.aepd.es/guias/guia-cookies.pdf" target="_blank" rel="noopener noreferrer">linee guida dell'Agencia Española de Protección de Datos (AEPD)</a>
      confermano che le preferenze scelte direttamente
      dall'utente, come la lingua o l'aspetto di un sito,
      sono esenti dall'obbligo di consenso quando vengono
      utilizzate esclusivamente per quella finalità.</p>
      <p>Gli strumenti di monitoraggio descritti nella
      sezione successiva non utilizzano cookie né salvano
      informazioni sul tuo dispositivo. Il controllo antispam
      del modulo di contatto è invece utilizzato per
      proteggere una funzionalità richiesta dall'utente.</p>
      <p>Di conseguenza, per le funzionalità e le tecnologie
      utilizzate attualmente da questo sito non è necessario
      mostrare un cookie banner o richiedere il consenso
      prima della navigazione.</p>

  - heading: "Monitoraggio delle prestazioni ed errori"
    body: >-
      <p>Utilizzo due servizi per controllare le prestazioni
      del sito e individuare eventuali problemi tecnici.
      Entrambi funzionano senza installare cookie o salvare
      informazioni nel local storage del browser e sono
      configurati per non raccogliere dati che permettano
      di identificare i visitatori.</p>
    items:
      - term: "Vercel Speed Insights"
        description: >-
          <a href="https://vercel.com/docs/speed-insights" target="_blank" rel="noopener noreferrer">Vercel Speed Insights</a>
          misura le prestazioni delle pagine durante la
          navigazione. Raccoglie informazioni come il percorso
          e l'URL della pagina visitata, il tipo di dispositivo,
          il sistema operativo, il browser, la velocità della
          connessione, il Paese di provenienza e i tempi
          di caricamento. Secondo la
          <a href="https://vercel.com/docs/speed-insights/privacy-policy" target="_blank" rel="noopener noreferrer">documentazione di Vercel</a>,
          questi dati non vengono associati a un visitatore
          o a un indirizzo IP specifico e non consentono
          di ricostruire la navigazione di una persona
          tra più pagine.
      - term: "Sentry"
        description: >-
          <a href="https://sentry.io/" target="_blank" rel="noopener noreferrer">Sentry</a>
          raccoglie le segnalazioni degli errori tecnici
          per aiutarmi a individuarli e correggerli.
          Le informazioni comprendono il messaggio di errore,
          il punto del codice in cui si è verificato
          e la pagina interessata. Il servizio è configurato
          per escludere gli indirizzi IP, i contenuti
          dei moduli e i cookie. Anche la registrazione
          delle sessioni, che permetterebbe di riprodurre
          le interazioni dell'utente con la pagina,
          è disattivata.

  - heading: "Protezione antispam del modulo di contatto"
    body: >-
      <p>La pagina di contatto utilizza
      <a href="https://www.cloudflare.com/products/turnstile/" target="_blank" rel="noopener noreferrer">Cloudflare Turnstile</a>
      per verificare che i messaggi provengano da richieste
      legittime e proteggere il modulo da spam e invii
      automatizzati. Il controllo viene caricato soltanto
      nella pagina di contatto, all'interno di un iframe
      fornito da Cloudflare, e non viene eseguito durante
      la normale navigazione nelle altre pagine del sito.</p>
      <p>Per effettuare la verifica, Turnstile tratta
      l'indirizzo IP e alcune informazioni tecniche
      relative al browser e al dispositivo. Nella
      configurazione utilizzata da questo sito non imposta
      cookie sul dominio del sito. Cloudflare descrive
      le informazioni raccolte e le relative finalità
      nel proprio
      <a href="https://www.cloudflare.com/turnstile-privacy-policy/" target="_blank" rel="noopener noreferrer">addendum sulla privacy di Turnstile</a>.</p>
      <p>Il controllo è necessario per utilizzare il modulo
      di contatto in modo sicuro e rientra nell'eccezione
      prevista dall'articolo 22.2 della LSSI-CE per
      le funzionalità espressamente richieste dall'utente.
      Non viene utilizzato per finalità pubblicitarie
      o di profilazione da parte di questo sito.</p>
      <p>Se il controllo dovesse impedire l'invio di un
      messaggio, puoi comunque contattarmi direttamente
      via email o prenotare una chiamata.</p>

  - heading: "Come bloccare gli strumenti di monitoraggio"
    body: >-
      <p>Se preferisci impedire anche la raccolta delle
      metriche anonime di Vercel Speed Insights o delle
      segnalazioni tecniche di Sentry, puoi utilizzare
      un'estensione del browser che blocca gli script
      di terze parti, come
      <a href="https://ublockorigin.com/" target="_blank" rel="noopener noreferrer">uBlock Origin</a>.</p>
      <p>A seconda delle impostazioni e delle liste di
      filtri utilizzate, queste estensioni possono bloccare
      le richieste inviate ai servizi di monitoraggio.
      Il loro blocco non compromette le funzionalità
      principali del sito, che non dipendono da questi
      strumenti.</p>
      <p>Le stesse estensioni possono però impedire
      il funzionamento di Cloudflare Turnstile.
      In quel caso non sarà possibile inviare il modulo
      di contatto, ma potrai comunque scrivermi
      direttamente via email o prenotare una chiamata.</p>

  - heading: "Modifiche a questa informativa"
    body: >-
      <p>Se in futuro dovessi introdurre funzionalità
      che richiedono l'uso di cookie o altre tecnologie
      soggette al consenso, aggiornerò questa informativa
      e introdurrò un sistema per raccogliere la tua scelta
      prima di attivare tali funzionalità.</p>
      <p>La data di ultimo aggiornamento, indicata
      all'inizio della pagina, permette di sapere
      quando il testo è stato modificato per l'ultima
      volta.</p>
      <p>Per maggiori informazioni sul trattamento
      dei dati personali, sui fornitori utilizzati
      e sui tuoi diritti, consulta
      l'<a href="/it/privacy/">informativa sulla privacy</a>.</p>
