metadata:
  title: "Recommendations | Luca Pipolo"

title: "Recommendations"

intro: >-
  What clients, managers and teammates have written about working with me,
  as they posted it on LinkedIn.

quotes:
  - initials: "SM"
    avatar: "/recommendations/shadi-manna.jpeg"
    href: "https://www.linkedin.com/in/shadimanna-woocommerce-agency/"
    name: "Shadi Manna"
    role: "Founder & WooExpert, Progressus.io"
    date: 2022-11-13
    text: >-
      Luca is a proficient full-stack developer. He helped our agency with
      multiple projects both with frontend and backend work. He is a great
      communicator and takes ownership of his responsibilities.

  - initials: "MB"
    avatar: "/recommendations/manuel-bruschi.jpeg"
    href: "https://www.linkedin.com/in/manuel-bruschi/"
    name: "Manuel Bruschi"
    role: "Co-Founder & CEO, Early"
    date: 2022-01-25
    text: >-
      Give Luca a frontend or backend problem in the web space and rest
      assured he will take care of it. He'll figure out how to solve it,
      involve and manage other stakeholders, and proactively keep everyone in
      the loop.

  - initials: "TM"
    avatar: "/recommendations/tom-mursell.jpeg"
    href: "https://www.linkedin.com/in/mursell/"
    name: "Tom Mursell"
    role: "CMO & Head of Product Growth, Early"
    date: 2022-01-20
    text: >-
      I loved working with Luca on interesting problems - he's naturally
      optimistic, brings energy and moves fast to get stuff done. He's
      definitely someone you'd like on your side.

  - initials: "TH"
    avatar: "/recommendations/tom-hare.jpeg"
    href: "https://www.linkedin.com/in/t0mh4re/"
    name: "Tom Hare"
    role: "Lead Software Engineer, Uswitch"
    date: 2021-04-08
    text: >-
      Resourceful, reliable and pragmatic are three words I'd use to describe
      Luca as a developer. I had the pleasure of working in a team with Luca
      for four years and his ability to immediately grasp the essence of a
      technical challenge was striking. The best developers don't have to have
      an answer to every problem - understanding the problem and then working
      collaboratively to find the best solution is much better. And Luca has
      this process nailed!

  - initials: "JK"
    avatar: "/recommendations/jennifer-koffler.jpeg"
    href: "https://www.linkedin.com/in/jennifer-koffler/"
    name: "Jennifer Koffler"
    role: "Team Leader Digital Marketing, HAURATON"
    date: 2021-03-31
    text: >-
      I wonder if I will ever work with a web developer again who combines the
      most important aspects for me so perfectly? Excellent know-how in all
      facets of the DEV field plus very pleasant, direct customer
      communication. On top: A great teamplayer with impressive skills in
      project management. I don't know... In any case, it will be hard to find
      someone with similar skills like Luca. Therefore I'm glad still working
      with him. I've been working intensively with Luca for over 1,5 years and
      he's one of the most important parts in implementing project in terms of
      our digital strategy at HAURATON. At HAURATON I'm the Project Owner for
      the Digital Marketing Strategy and therefore Luca has always given me a
      very secure feeling in any kind of complex DEV topic - from WordPress
      implementation until eCommerce. Thanks!

  - initials: "CD"
    avatar: "/recommendations/christina-dilio.jpeg"
    href: "https://www.linkedin.com/in/christina-dilio/"
    name: "Christina D'Ilio"
    role: "Digital strategist & speaker, netzstrategen"
    date: 2021-03-25
    text: >-
      I was lucky enough to work with Luca for over 4.5 years. Our paths
      crossed at netzstrategen. There I develop strategies for our clients and
      take over the project management for the implementation. At that point,
      having Luca involved in the project was half the battle. Not only is he
      an excellent web developer when it comes to eCommerce, corporate or media
      publishers, he is at least as good at coordinating and communicating with
      colleagues and clients. He made my life as a project manager very easy.
      If it was up to me, I would gladly do every development project with
      him.

  - initials: "OC"
    avatar: "/recommendations/olga-cacenabes.jpeg"
    href: "https://www.linkedin.com/in/olga-cacenabes/"
    name: "Olga Cacenabes"
    role: "Senior UX Designer, Shopify"
    date: 2020-02-17
    text: |-
      I had the opportunity to collaborate with Luca on lots of different digital projects and I learned a lot working side by side with him.

      He is a brilliant, efficient, responsible and super organized person, and he is always willing to help and support his colleagues. His technical skills are impressive and his knowledge of tools and methodologies is amazing.

      On the personal side, he is a really good teammate. He is very kind, open-minded and empathic. I would love to work with him again in the near future.

  - initials: "JL"
    avatar: "/recommendations/joan-lopez.jpeg"
    href: "https://www.linkedin.com/in/juanlopez4691/"
    name: "Joan López"
    role: "Senior Full-Stack Developer, somoscuatro"
    date: 2020-01-24
    text: |-
      I enjoyed working together with Luca for more than 2 years at netzstrategen. We were web developers team mates, working in diverse projects, mostly WordPress and WooCommerce based.

      Luca is a brilliant developer, smart and able to quickly figure out efficient solutions to complex problems. His knowledge of WordPress, PHP, JS and all the related stack is impressive and keeps improving, as he is an avid learner. Besides, he has a unique talent for analyzing, defining and organizing projects priorities, needs and requirements.

      On the personal side, he is an amazing team mate, generous and empathic, always eager to help, support and share knowledge.

  - initials: "JM"
    avatar: "/recommendations/julia-mestieri-ferrer.jpeg"
    href: "https://www.linkedin.com/in/julia-mestieri-ferrer/"
    name: "Julià Mestieri Ferrer"
    role: "CIO, CTO & IT Director, AXA"
    date: 2019-05-31
    text: |-
      I had the chance to work with Luca for more than 2 years at netzstrategen. We worked together to set up the Barcelona office of the company and also worked together in lots of big and small projects: corporate sites, e-commerce, media publishers...

      Luca's technical skills are impressive, he can work in almost any web project. His background and skill set makes him capable to achieve any goal. Also, his learning capacity keeps him updated with new best practices and technologies by default. In the soft-skill aspects, he has really good communication and empathy in dealing with regular daily work but also to manage challenging and conflict situations.

      Luca is the person you want to have in your team when something challenging is coming.

  - initials: "SC"
    avatar: "/recommendations/susanna-casali.jpeg"
    href: "https://www.linkedin.com/in/susannacasali/"
    name: "Susanna Casali"
    role: "UX Project Lead, Bertrandt"
    date: 2015-08-24
    text: >-
      I met Luca on set during the photo shoot for the update of the Yamamay
      e-commerce site. Luca took care of automating the process, classifying
      the photos by matching them to their product codes, and resizing and
      optimising them. He is a very precise person who managed to meet the
      planned delivery dates despite some complications caused by external
      factors. Luca is a professional in his field, fast and very precise,
      which is why I later contacted him again, as a Web Developer, for other
      projects.
