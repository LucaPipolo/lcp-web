metadata:
  title: "Recomendaciones | Luca Pipolo"

title: "Recomendaciones"

intro: >-
  Lo que clientes, managers y compañeros han escrito sobre trabajar conmigo,
  tal como lo publicaron en LinkedIn.

quotes:
  - initials: "SM"
    avatar: "/recommendations/shadi-manna.jpeg"
    href: "https://www.linkedin.com/in/shadimanna-woocommerce-agency/"
    name: "Shadi Manna"
    role: "Founder & WooExpert, Progressus.io"
    date: 2022-11-13
    text: >-
      Luca es un desarrollador full-stack muy competente. Ayudó a nuestra
      agencia en varios proyectos, tanto en frontend como en backend. Se
      comunica muy bien y se toma en serio sus responsabilidades.

  - initials: "MB"
    avatar: "/recommendations/manuel-bruschi.jpeg"
    href: "https://www.linkedin.com/in/manuel-bruschi/"
    name: "Manuel Bruschi"
    role: "Co-Founder & CEO, Early"
    date: 2022-01-25
    text: >-
      Dale a Luca cualquier problema de frontend o backend y puedes estar
      tranquilo: encontrará la forma de resolverlo, involucrará y gestionará a
      los stakeholders necesarios, y mantendrá a todo el mundo al tanto sin que
      nadie se lo pida.

  - initials: "TM"
    avatar: "/recommendations/tom-mursell.jpeg"
    href: "https://www.linkedin.com/in/mursell/"
    name: "Tom Mursell"
    role: "CMO & Head of Product Growth, Early"
    date: 2022-01-20
    text: >-
      Disfruté muchísimo trabajando con Luca en problemas interesantes: es
      optimista por naturaleza, aporta energía y va rápido cuando hay que sacar
      las cosas adelante. Sin duda alguien que querrías tener de tu lado.

  - initials: "TH"
    avatar: "/recommendations/tom-hare.jpeg"
    href: "https://www.linkedin.com/in/t0mh4re/"
    name: "Tom Hare"
    role: "Ingeniero de software principal, Uswitch"
    date: 2021-04-08
    text: >-
      Resolutivo, fiable y pragmático. Son las tres palabras que usaría
      para describir a Luca como desarrollador. Tuve el placer de trabajar
      con él en el mismo equipo durante cuatro años y siempre me sorprendió
      su capacidad para entender enseguida lo esencial de un reto técnico.
      Los mejores desarrolladores no tienen por qué conocer la respuesta
      a todos los problemas. Es mucho más importante entender bien el
      problema y colaborar con los demás para encontrar la mejor solución.
      ¡Y Luca domina esa forma de trabajar!

  - initials: "JK"
    avatar: "/recommendations/jennifer-koffler.jpeg"
    href: "https://www.linkedin.com/in/jennifer-koffler/"
    name: "Jennifer Koffler"
    role: "Responsable del equipo de marketing digital, HAURATON"
    date: 2021-03-31
    text: >-
      Me pregunto si volveré a trabajar con un desarrollador web que reúna
      tan bien todas las cualidades que considero importantes. Tiene
      excelentes conocimientos en todas las áreas del desarrollo y, además,
      una forma de comunicarse con los clientes muy agradable y directa.
      Por si fuera poco, es un gran compañero de equipo, con unas
      habilidades de gestión de proyectos impresionantes. No sé si
      encontraré fácilmente a alguien con un perfil parecido al suyo.
      Por eso me alegra seguir trabajando con él. Llevamos más de un año
      y medio colaborando estrechamente y Luca se ha convertido en una
      pieza fundamental para llevar a cabo los proyectos de nuestra
      estrategia digital en HAURATON. Como responsable de esta estrategia,
      siempre me ha transmitido mucha confianza a la hora de abordar
      cualquier cuestión técnica compleja, desde implementaciones con
      WordPress hasta proyectos de comercio electrónico. ¡Gracias!

  - initials: "CD"
    avatar: "/recommendations/christina-dilio.jpeg"
    href: "https://www.linkedin.com/in/christina-dilio/"
    name: "Christina D'Ilio"
    role: "Estratega digital y ponente, netzstrategen"
    date: 2021-03-25
    text: >-
      Tuve la suerte de trabajar con Luca durante más de cuatro años y
      medio. Coincidimos en netzstrategen, donde yo desarrollaba
      estrategias para nuestros clientes y gestionaba los proyectos
      necesarios para ponerlas en marcha. Contar con Luca en un proyecto
      era tener medio trabajo hecho. Es un excelente desarrollador web,
      tanto para proyectos de e-commerce como para webs corporativas
      o medios digitales, pero también destaca por su capacidad para
      coordinarse y comunicarse con compañeros y clientes. Me facilitó
      muchísimo el trabajo como project manager. Si dependiera de mí,
      volvería a trabajar con él en todos mis proyectos de desarrollo.

  - initials: "OC"
    avatar: "/recommendations/olga-cacenabes.jpeg"
    href: "https://www.linkedin.com/in/olga-cacenabes/"
    name: "Olga Cacenabes"
    role: "Diseñadora UX sénior, Shopify"
    date: 2020-02-17
    text: |-
      Tuve la oportunidad de colaborar con Luca en muchos proyectos digitales diferentes y aprendí muchísimo trabajando a su lado.

      Es una persona brillante, eficiente, responsable y muy organizada, siempre dispuesta a ayudar y apoyar a sus compañeros. Sus conocimientos técnicos son impresionantes, al igual que su dominio de herramientas y metodologías.

      En lo personal, es un compañero de equipo estupendo. Es amable, tiene una mentalidad abierta y mucha empatía. Me encantaría volver a trabajar con él en el futuro.

  - initials: "JL"
    avatar: "/recommendations/joan-lopez.jpeg"
    href: "https://www.linkedin.com/in/juanlopez4691/"
    name: "Joan López"
    role: "Desarrollador full-stack sénior, somoscuatro"
    date: 2020-01-24
    text: |-
      Trabajé con Luca durante más de dos años en netzstrategen y fue un placer compartir equipo con él. Éramos compañeros de desarrollo web y participamos en proyectos muy diversos, principalmente con WordPress y WooCommerce.

      Luca es un desarrollador brillante, inteligente y capaz de encontrar rápidamente soluciones eficientes a problemas complejos. Sus conocimientos de WordPress, PHP, JavaScript y todo el ecosistema relacionado son impresionantes y no dejan de crecer, porque siempre está aprendiendo cosas nuevas. Además, tiene una capacidad especial para analizar, definir y organizar las prioridades, necesidades y requisitos de un proyecto.

      En lo personal, es un compañero fantástico, generoso y empático, siempre dispuesto a ayudar, apoyar y compartir sus conocimientos.

  - initials: "JM"
    avatar: "/recommendations/julia-mestieri-ferrer.jpeg"
    href: "https://www.linkedin.com/in/julia-mestieri-ferrer/"
    name: "Julià Mestieri Ferrer"
    role: "CIO, CTO y director de IT, AXA"
    date: 2019-05-31
    text: |-
      Tuve la oportunidad de trabajar con Luca durante más de dos años en netzstrategen. Colaboramos en la puesta en marcha de la oficina de Barcelona y trabajamos juntos en numerosos proyectos, grandes y pequeños: webs corporativas, e-commerce, medios digitales...

      Sus conocimientos técnicos son impresionantes y puede trabajar prácticamente en cualquier proyecto web. Su experiencia y sus habilidades le permiten afrontar cualquier reto, y su capacidad de aprendizaje hace que esté siempre al día de las nuevas tecnologías y buenas prácticas. En cuanto a sus habilidades personales, destaca por su comunicación y empatía, tanto en el trabajo diario como a la hora de gestionar situaciones difíciles o conflictivas.

      Luca es la persona que quieres tener en tu equipo cuando se presenta un reto complicado.

  - initials: "SC"
    avatar: "/recommendations/susanna-casali.jpeg"
    href: "https://www.linkedin.com/in/susannacasali/"
    name: "Susanna Casali"
    role: "UX Project Lead, Bertrandt"
    date: 2015-08-24
    text: >-
      Conocí a Luca durante la sesión de fotos para la actualización del
      e-commerce de Yamamay. Se encargó de automatizar el proceso de
      clasificación de las fotografías, asociándolas a sus códigos de
      producto, además de redimensionarlas y optimizarlas. Es una persona
      muy meticulosa que consiguió cumplir los plazos de entrega previstos,
      a pesar de algunas complicaciones por factores externos. Luca es
      un gran profesional, rápido y preciso en su trabajo, y por eso
      volví a contactar con él como desarrollador web para otros proyectos.
