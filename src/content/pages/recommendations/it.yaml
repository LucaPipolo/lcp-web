metadata:
  title: "Raccomandazioni | Luca Pipolo"

title: "Raccomandazioni"

intro: >-
  Cosa hanno scritto clienti, manager e colleghi sul lavorare con me, così
  come l'hanno pubblicato su LinkedIn.

quotes:
  - initials: "SM"
    avatar: "/recommendations/shadi-manna.jpeg"
    href: "https://www.linkedin.com/in/shadimanna-woocommerce-agency/"
    name: "Shadi Manna"
    role: "Founder & WooExpert, Progressus.io"
    date: 2022-11-13
    text: >-
      Luca è uno sviluppatore full-stack molto capace. Ha aiutato la nostra
      agenzia su diversi progetti, sia lato frontend che backend. Comunica
      benissimo e si prende sul serio le proprie responsabilità.

  - initials: "MB"
    avatar: "/recommendations/manuel-bruschi.jpeg"
    href: "https://www.linkedin.com/in/manuel-bruschi/"
    name: "Manuel Bruschi"
    role: "Co-Founder & CEO, Early"
    date: 2022-01-25
    text: >-
      Dai a Luca un problema di frontend o backend nel mondo web e puoi stare
      tranquillo: capirà come risolverlo, coinvolgerà e gestirà gli
      stakeholder giusti e terrà tutti aggiornati senza bisogno di
      chiederglielo.

  - initials: "TM"
    avatar: "/recommendations/tom-mursell.jpeg"
    href: "https://www.linkedin.com/in/mursell/"
    name: "Tom Mursell"
    role: "CMO & Head of Product Growth, Early"
    date: 2022-01-20
    text: >-
      Mi è piaciuto moltissimo lavorare con Luca su problemi interessanti: è
      ottimista di natura, porta energia e va veloce quando c'è da portare a
      casa il risultato. Uno che vorresti sicuramente dalla tua.

  - initials: "TH"
    avatar: "/recommendations/tom-hare.jpeg"
    href: "https://www.linkedin.com/in/t0mh4re/"
    name: "Tom Hare"
    role: "Lead Software Engineer, Uswitch"
    date: 2021-04-08
    text: >-
      Intraprendente, affidabile e pragmatico: sono le tre parole che
      userei per descrivere Luca come sviluppatore. Ho avuto il piacere
      di lavorare con lui nello stesso team per quattro anni e mi ha
      sempre colpito la sua capacità di cogliere subito il punto
      centrale di un problema tecnico. I migliori sviluppatori non
      devono necessariamente avere una risposta a tutto. È molto
      più importante capire bene il problema e collaborare con gli
      altri per trovare la soluzione migliore. E Luca è davvero
      bravissimo in questo!

  - initials: "JK"
    avatar: "/recommendations/jennifer-koffler.jpeg"
    href: "https://www.linkedin.com/in/jennifer-koffler/"
    name: "Jennifer Koffler"
    role: "Responsabile del team Digital Marketing, HAURATON"
    date: 2021-03-31
    text: >-
      Mi chiedo se avrò mai la fortuna di lavorare di nuovo con uno
      sviluppatore web capace di riunire così bene tutte le qualità
      che considero importanti. Luca ha competenze eccellenti in
      ogni ambito dello sviluppo e, allo stesso tempo, un modo di
      comunicare con i clienti piacevole e diretto. In più, è un
      ottimo collega, con capacità di project management davvero
      notevoli. Non so quanto sarà facile trovare qualcuno con
      competenze simili alle sue. Per questo sono felice di
      continuare a lavorare con lui. Collaboriamo a stretto
      contatto da oltre un anno e mezzo e Luca è diventato una
      figura fondamentale per realizzare i progetti della nostra
      strategia digitale in HAURATON. Come responsabile della
      strategia di Digital Marketing, posso dire che mi ha sempre
      trasmesso grande sicurezza nell'affrontare qualsiasi
      questione tecnica complessa, dalle implementazioni WordPress
      ai progetti e-commerce. Grazie!

  - initials: "CD"
    avatar: "/recommendations/christina-dilio.jpeg"
    href: "https://www.linkedin.com/in/christina-dilio/"
    name: "Christina D'Ilio"
    role: "Digital strategist e speaker, netzstrategen"
    date: 2021-03-25
    text: >-
      Ho avuto la fortuna di lavorare con Luca per oltre quattro anni
      e mezzo. Ci siamo conosciuti in netzstrategen, dove mi occupavo
      di sviluppare strategie per i nostri clienti e di gestire i
      progetti necessari per realizzarle. Avere Luca nel team
      significava essere già a metà dell'opera. È un ottimo
      sviluppatore web, che si tratti di e-commerce, siti aziendali
      o portali editoriali, ma è altrettanto bravo a coordinarsi e
      comunicare con colleghi e clienti. Mi ha reso la vita da
      project manager molto più semplice. Se dipendesse da me,
      lavorerei volentieri con lui a ogni progetto di sviluppo.

  - initials: "OC"
    avatar: "/recommendations/olga-cacenabes.jpeg"
    href: "https://www.linkedin.com/in/olga-cacenabes/"
    name: "Olga Cacenabes"
    role: "Senior UX Designer, Shopify"
    date: 2020-02-17
    text: |-
      Ho avuto l'opportunità di collaborare con Luca a tanti progetti digitali diversi e ho imparato moltissimo lavorando al suo fianco.

      È una persona brillante, efficiente, responsabile e super organizzata, sempre pronta ad aiutare e sostenere i colleghi. Le sue competenze tecniche sono impressionanti, così come la sua conoscenza di strumenti e metodologie.

      Dal punto di vista personale, è davvero un ottimo collega. È gentile, aperto e molto empatico. Mi piacerebbe tantissimo tornare a lavorare con lui in futuro.

  - initials: "JL"
    avatar: "/recommendations/joan-lopez.jpeg"
    href: "https://www.linkedin.com/in/juanlopez4691/"
    name: "Joan López"
    role: "Senior Full-Stack Developer, somoscuatro"
    date: 2020-01-24
    text: |-
      Ho lavorato con Luca per oltre due anni in netzstrategen ed è stato un piacere averlo come collega. Eravamo entrambi sviluppatori web e abbiamo collaborato a progetti molto diversi, principalmente basati su WordPress e WooCommerce.

      Luca è uno sviluppatore brillante, intelligente e capace di trovare rapidamente soluzioni efficienti a problemi complessi. Le sue conoscenze di WordPress, PHP, JavaScript e di tutto il relativo stack sono impressionanti e continuano a crescere, perché ha sempre voglia di imparare. Ha inoltre una capacità particolare di analizzare, definire e organizzare le priorità, le esigenze e i requisiti di un progetto.

      Sul piano personale è un collega fantastico, generoso ed empatico, sempre disponibile ad aiutare, sostenere gli altri e condividere le proprie conoscenze.

  - initials: "JM"
    avatar: "/recommendations/julia-mestieri-ferrer.jpeg"
    href: "https://www.linkedin.com/in/julia-mestieri-ferrer/"
    name: "Julià Mestieri Ferrer"
    role: "CIO, CTO e IT Director, AXA"
    date: 2019-05-31
    text: |-
      Ho avuto l'opportunità di lavorare con Luca per oltre due anni in netzstrategen. Abbiamo collaborato all'apertura della sede di Barcellona e lavorato insieme a numerosi progetti, grandi e piccoli: siti aziendali, e-commerce, portali editoriali...

      Le competenze tecniche di Luca sono impressionanti e gli permettono di lavorare praticamente a qualsiasi progetto web. La sua esperienza e le sue capacità lo rendono in grado di affrontare qualsiasi sfida, mentre la sua voglia di imparare lo porta a tenersi costantemente aggiornato sulle nuove tecnologie e sulle best practice. Dal punto di vista delle soft skill, ha ottime capacità comunicative e una grande empatia, sia nel lavoro quotidiano sia nella gestione di situazioni difficili o conflittuali.

      Luca è la persona che vorresti nel tuo team quando si presenta una sfida impegnativa.

  - initials: "SC"
    avatar: "/recommendations/susanna-casali.jpeg"
    href: "https://www.linkedin.com/in/susannacasali/"
    name: "Susanna Casali"
    role: "UX Project Lead, Bertrandt"
    date: 2015-08-24
    text: >-
      Ho conosciuto Luca sul set durante lo shooting fotografico per
      l'aggiornamento del sito e-commerce di Yamamay. Luca si occupava
      di automatizzare il processo di classificazione delle fotografie,
      associandole ai rispettivi codici prodotto, oltre a
      ridimensionarle e ottimizzarle. È una persona molto precisa,
      che è riuscita a rispettare le scadenze previste nonostante
      alcune complicazioni dovute a fattori esterni. Luca è un
      professionista competente, rapido e molto accurato nel suo
      lavoro, motivo per cui l'ho ricontattato successivamente
      come web developer per altri progetti.
