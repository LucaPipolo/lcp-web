name: Audit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - package.json
      - bun.lock
      - .github/workflows/audit.yml
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # GitHub's dependency graph reads only package.json, not bun.lock, so
      # Dependabot alerts miss transitive dependencies. This reads the lockfile.
      - name: Check dependencies against GitHub advisories
        run: bun run check:audit
